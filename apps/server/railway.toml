# Railway service config for the Cachet server (set this file as the service's config path).
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/server/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# One instance only: the Telegram bot (long polling) and the anchoring worker must not run twice.
numReplicas = 1
