# Local development services. Start with `pnpm db:up`, stop with `pnpm db:down`.
# Ports are bound to localhost only.
name: cachet

services:
  postgres:
    image: postgres:18-alpine
    # Start again automatically whenever Docker Desktop starts.
    restart: unless-stopped
    environment:
      POSTGRES_USER: cachet
      POSTGRES_PASSWORD: cachet
      POSTGRES_DB: cachet
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<version>/
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cachet -d cachet']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
